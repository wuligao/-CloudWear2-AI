datasource:
  defalut:
    type: mysql
    host: 127.0.0.1
    port: 3306
    username: cloudwear
    password: CHANGE_ME
    database: vivy-nest-admin
    synchronize: false
    autoLoadEntities: true
    bigNumberStrings: false
    supportBigNumbers: true

redis:
  defalut:
    host: 127.0.0.1
    port: 6379
    # If Redis has no password, remove username/password.
    username: default
    password: CHANGE_ME
    db: 0

bull:
  redis:
    host: 127.0.0.1
    port: 6379
    # If Redis has no password, remove username/password.
    username: default
    password: CHANGE_ME
    db: 1

outfitAi:
  textApiKey: CHANGE_ME
